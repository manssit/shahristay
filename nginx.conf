server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  gzip on;
  gzip_types text/html text/css application/javascript;
  gzip_min_length 1024;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  absolute_redirect off;
  location = / { try_files /index.html =404; add_header Cache-Control "public, max-age=300"; }
  location / { try_files $uri $uri.html $uri/ =404; add_header Cache-Control "public, max-age=300"; }
}
