<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شهري ستاي — النسخة التجريبية التفاعلية</title>
<meta name="robots" content="noindex">
<style>
  body { margin:0; font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif; }
  #demoRibbon { position:fixed; bottom:12px; left:12px; z-index:9999; background:rgba(13,27,42,.88); color:#2EE6C3; font-size:10.5px; font-weight:700; border:1px solid rgba(46,230,195,.4); border-radius:16px; padding:6px 13px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); pointer-events:none; }
  #boot { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; color:#5B6B7A; font-size:13px; gap:10px; }
  #errBox { display:none; margin:20px; padding:14px; background:#FBE9E7; border:1px solid #E57368; border-radius:12px; color:#7A2E22; font-size:12px; direction:ltr; text-align:left; word-break:break-all; }
</style>
</head>
<body>
<div id="root"><div id="boot">جارٍ تحميل المنصة… ⏳</div></div>
<div id="errBox"></div>
<div id="demoRibbon">عرض تجريبي تفاعلي — البيانات والمسارات توضيحية</div>
<script>
window.onerror = function (msg, src, line, col) {
  var b = document.getElementById("errBox");
  b.style.display = "block";
  b.textContent = "Runtime error: " + msg + " @ " + line + ":" + col;
};
</script>
<script src="demo.js" defer></script>
</body>
</html>
